[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agent-osint"
version = "0.1.0"
description = "Seven organization-focused OSINT MCP servers for AI agents: SiteGraph, CommentForensics, IntegrityLens, DSA-Lens, Procurement Red Flags, DepCheck, ClaimTrail."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "agent-osint contributors" }]
keywords = ["mcp", "osint", "model-context-protocol", "ai-agents", "ads.txt", "regulations.gov", "research-integrity", "dsa", "procurement", "supply-chain"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "mcp>=1.9,<2",  # v2 renamed FastMCP; see VERIFICATION.md
  "httpx>=0.27",
  "pydantic>=2.6",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "tldextract>=5.1",
  "ijson>=3.2",
  "datasketch>=1.6",
  "rapidfuzz>=3.6",
  "duckdb>=1.0",
  "warcio>=1.7",
  "tzdata; sys_platform == 'win32'",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
c2pa = ["c2pa-python>=0.37"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
agent-osint-sitegraph = "agent_osint.sitegraph.server:main"
agent-osint-commentforensics = "agent_osint.commentforensics.server:main"
agent-osint-integritylens = "agent_osint.integritylens.server:main"
agent-osint-dsalens = "agent_osint.dsalens.server:main"
agent-osint-procurement = "agent_osint.procurement.server:main"
agent-osint-depcheck = "agent_osint.depcheck.server:main"
agent-osint-claimtrail = "agent_osint.claimtrail.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_osint"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: hits real network services (run with -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]
ignore = ["E501", "UP007", "B008", "B905", "B023"]  # B023: closures are called within the same iteration
