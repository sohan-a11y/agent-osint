name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # weekly live check catches upstream API changes

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,c2pa]"
      - run: ruff check src tests
      - run: pytest -q

  live:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,c2pa]"
      - run: pytest -m live -q
      - run: python scripts/live_smoke.py
        env:
          AGENT_OSINT_CONTACT: ${{ secrets.AGENT_OSINT_CONTACT }}
          REGULATIONS_GOV_API_KEY: ${{ secrets.REGULATIONS_GOV_API_KEY }}
          PUBPEER_DEVKEY: ${{ secrets.PUBPEER_DEVKEY }}
          DSA_TDB_TOKEN: ${{ secrets.DSA_TDB_TOKEN }}
          META_AD_LIBRARY_TOKEN: ${{ secrets.META_AD_LIBRARY_TOKEN }}
          GOOGLE_FACTCHECK_API_KEY: ${{ secrets.GOOGLE_FACTCHECK_API_KEY }}
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
